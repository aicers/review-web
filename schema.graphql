	not a module package-id, or if the ledger cannot be read.
	"""
	inFlightInstalls(host: String!, target: String!): [OperationAttempt!]!
	"""
	Returns the latest install attempt for `(host, target)`, whatever its
	phase or outcome, or null if the pair has none.
	
	"Latest" is the greatest `(startedAt, id)`, the order
	`inFlightInstalls` lists by. The answer reads by its outcome: a null
	`outcome` means the install is still running, as `inFlightInstalls`
	also says; `SUCCEEDED` means the instance's service row is there or
	about to be; and `FAILED`, `ROLLED_BACK` or `CANCELLED` is how the last
	install of the module on the host ended, with `failureKind` and
	`cleanupOwed` as the attempt carries them.
	
	A failed first install leaves no service row — one is created only on
	terminal success — so no inline attempt reaches it, and this query is
	the only way to find it without its id. The next install of the pair
	supersedes it, so the answer clears itself and a history of failures
	never shows more than one.
	
	Ordering rows by request is right here, although the inline latest
	attempt refuses to: that field answers "the current attempt of an
	instance", where a superseded attempt may still owe a teardown and
	remains current until it is discharged. This query answers "the last
	install request for the pair", and request order is exactly that. A
	row that still owes cleanup is returned with `cleanupOwed` set, not
	hidden.
	
	The install attempts of the hosts' operational log collectors are left
	out, as [`operator_installs`] describes, before the latest is chosen:
	node cards read this for an operator's install, which must never show a
	system install of the same `(host, reproduce)`, nor be hidden by one.
	
	# Errors
	
	Returns an error if the caller has no access to `host`, if `target` is
	not a module package-id, or if the ledger cannot be read.
	"""
	latestInstall(host: String!, target: String!): OperationAttempt
	"""
	A list of triage responses.
	"""
	triageResponseList(after: String, before: String, first: Int, last: Int): TriageResponseConnection!
	"""
	Looks up a triage response by the given sensor and time.
	"""
	triageResponse(sensor: String!, time: DateTime!): TriageResponse
	"""
	A list of trusted domains.
	"""
	trustedDomainList(after: String, before: String, first: Int, last: Int): TrustedDomainConnection!
	"""
	traffic filtering rules of agents.
	"""
	trafficFilterList(hostFqdns: [String!]): [TrafficFilter!]
	"""
	A list of trusted user agent list.
	"""
	trustedUserAgentList(after: String, before: String, first: Int, last: Int): TrustedUserAgentConnection!
	"""
	Returns the addresses review would propose for the next instance of
	`target` on `host`.
	
	It takes no `instance`: the instance being recommended for is the one
	the following install will allocate. It reserves nothing, so a proposal
	goes stale only between this call and the install that carries it back,
	and that install is where the staleness is caught.
	"""
	recommendBindAddrs(host: String!, target: String!): RecommendBindAddrsResult!
	"""
	Returns the roxyd build each connected host reports running, offered as
	copy candidates for `onboardHost`.
	
	It is a snapshot at read time, which `onboardHost` does not check
	against.
	
	# Errors
	
	Returns an error if the hosts could not be enumerated.
	"""
	runningRoxydBuilds: [RunningRoxydBuild!]!
	"""
	Returns the builds the store serves for `packageId`, release and test
	alike, offered as the choices a build selector may name.
	
	The list is newest first in the release order: by version
	(`MAJOR.MINOR.PATCH`, compared numerically; a test build labelled
	otherwise takes the highest release version accepted before it), then
	a test build above a release build of the same version, then later
	acceptance above earlier. So the test builds labelled with a version
	come, newest first, after the next release build and before that
	version's own release build. The first entry with `release` set is the
	latest build; test builds are never latest.
	
	Only a module or core-component package-id is accepted. A core
	package-id additionally requires a System Administrator, as updating
	one does; a Security Administrator asking for one is refused with the
	same `Forbidden` the field guard gives, so the refusal reveals nothing
	about the store. An empty list means the store serves no build of the
	package.
	
	# Errors
	
	Returns an error if `packageId` is not a module or core-component
	package-id, if the caller may not list it, or if the store could not
	be read or still has a build of the package pending verification.
	"""
	storeBuildList(packageId: String!): [StoreBuild!]!
	"""
	Returns the configuration templates for a module package-id.
	
	`required` means an install must name a template. `templates` is in
	the catalog's declared order and may be empty; a required target with
	an empty list cannot be installed yet. No template body is ever returned.
	
	# Errors
	
	Returns an error if the target is not a module package-id, the caller
	may not list it, or the catalog could not be read.
	"""
	configTemplates(target: String!): ConfigTemplateList!
	"""
	The Central Manager node and the upstream NTP servers of its host.
	Fails with "the Central Manager host did not answer in time" when its
	Host Agent does not answer within 10 seconds.
	"""
	centralManagerTimeSources: CentralManagerTimeSources!
	"""
	The operational log collector of every host, in host order.
	
	The order is the one review answers in; nothing here re-sorts it.
	
	# Errors
	
	Returns an error if review could not list the collectors.
	"""
	systemLogCollectorList: [SystemLogCollector!]!
	"""
	The active query settings of each customer, in the requested order.
	One inaccessible customer refuses the whole call.
	"""
	daiActiveQuerySettings(customerIds: [ID!]!): [DaiActiveQuerySettings!]!
	"""
	Every site's active query settings, in token order. An unstored
	default site is listed first with a null token, without writing it.
	"""
	daiActiveQuerySites(customerId: ID!): [DaiActiveQuerySite!]!
	"""
	The IP's whole active answer history, including no-name and
	no-response rows and removed sites, in the store's order.
	"""
	daiActiveAnswers(customerId: ID!, site: String!, ip: String!): [DaiActiveAnswer!]!
	"""
	The device identification settings of each customer of
	`customerIds`, one entry per id, in order.
	
	A customer whose settings were never written reads as disabled, never
	enabled, an inactivity multiplier of 2, 24 hours without a lease, 180
	days of evidence aging, no realm and both revisions 0. One id the
	caller is not a member of refuses the whole call with `Forbidden`.
	"""
	daiCustomerSettings(customerIds: [ID!]!): [DaiCustomerSettings!]!
	"""
	Every site of the customer, in token order.
	
	The default site lists the customer's sensors that are in no other
	site. A customer whose default site is not stored yet lists one
	unsaved default site with a null token, and nothing is written.
	"""
	daiSites(customerId: ID!): [DaiSite!]!
	"""
	The customer's DHCP relay site table and its revision.
	"""
	daiRelaySites(customerId: ID!): DaiRelaySites!
	"""
	Resolves each of `items` to the subject its IP address names at its
	site, at its time or over its window, and returns one outcome per
	item, in order: an answer, or the item's own error.
	
	An item gives exactly one of `at`, or both `from` and `to`, a closed
	window. An item without `site` is resolved at the customer's one site
	in use, which a multi-site customer does not have. More than 1,000
	items refuse the whole call. With `withExplanation`, each answer
	carries the bindings that decided it and the causes of an evidence
	gap.
	"""
	daiResolve(customerId: ID!, items: [DaiResolveItemInput!]!, withExplanation: Boolean! = false): [DaiResolveOutcome!]!
	"""
	The customer's devices that match `filter`, ordered by device id.
	
	Each row carries the device's current IPs, the bindings in effect
	now, or, for a device with none, its binding with the latest start.
	The site and network filters match a device one of whose current IPs
	(or, with none, whose latest binding) is at a listed site and in the
	network; the seen range matches a device whose first-to-last seen
	range overlaps it.
	"""
	daiDevices(customerId: ID!, filter: DaiDeviceFilterInput, after: String, before: String, first: Int, last: Int): DaiDeviceConnection!
	"""
	The customer's IP device rows that match `filter`, ordered by site and
	IP.
	
	An IP device row is an IP address seen in the last 30 days at whose
	last seen time no device binding is in effect at its site and IP. It
	is not a device and is not counted as one.
	"""
	daiIpOnlyDevices(customerId: ID!, filter: DaiIpDeviceFilterInput, after: String, before: String, first: Int, last: Int): DaiIpDeviceConnection!
	"""
	The device `deviceId` names, in detail, or null if it names no device
	of the customer. An old id, one a merge made an alias, returns the
	current device.
	"""
	daiDevice(customerId: ID!, deviceId: ID!): DaiDeviceDetail
	"""
	Searches the customer's devices and IP device rows for `text`.
	
	`text` matches an IP address (the devices bound or fixed to it, and
	its IP device rows), a MAC as `aa:bb:cc:dd:ee:ff`, `aa-bb-cc-dd-ee-ff`
	or `aabb.ccdd.eeff` in any case, an operator asset id, a current or
	old device id, and a case-insensitive substring of a device name.
	Accounts are not searched. At most 100 matches are returned, with
	`truncated` set if there were more.
	"""
	daiSearch(customerId: ID!, text: String!): DaiSearchResult!
	"""
	The customer's device identification collection status now.
	"""
	daiCollectionStatus(customerId: ID!): DaiCollectionStatus!
	"""
	The customer's candidate unregistered internal ranges now, the
	ignored ones left out.
	
	A candidate is accepted by adding it to the customer's networks with
	`replaceCustomerNetworks`.
	"""
	daiRangeCandidates(customerId: ID!): [DaiRangeCandidate!]!
	"""
	The ranges the customer ignores, ordered by range.
	"""
	daiIgnoredRanges(customerId: ID!): [DaiIgnoredRange!]!
}

