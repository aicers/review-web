type ExternalService {
	nodeId: Int!
	key: String!
	kind: ExternalServiceKind!
	status: ExternalServiceStatus!
	draft: String
	"""
	The version of the build installed on the host, as the host reports it.
	
	An opaque display label that is not required to be semver. It is null
	together with `installedCommit` or not at all.
	"""
	installedVersion: String
	"""
	The commit of the build installed on the host, as the host reports it.
	
	Null together with `installedVersion` or not at all.
	"""
	installedCommit: String
	"""
	The install and run state of the build on the host, or null if the
	entry's kind maps to no package-id.
	
	`TI_CONTAINER` deploys from no package, so it reports null here rather
	than `NOT_INSTALLED`.
	"""
	lifecycle: Lifecycle
	"""
	The addresses this instance is currently bound to.
	
	An instance that has bound nothing yields the empty list, never null:
	the record stores a plain list, so "bound nowhere" and "we do not know
	where it is bound" are not distinguished.
	"""
	boundAddrs: [BoundAddr!]!
	"""
	The instance number this entry is, rendered as a decimal string.
	
	It is a `StringNumber` rather than an `Int` because the stored number
	is a `u32`, whose upper half has no valid `Int` representation. Null
	means the entry has no instance dimension or was written before any
	number was recorded.
	"""
	instance: StringNumber
	"""
	Whether the store's most recently accepted build for this entry's
	package differs from the installed one.
	
	It is inequality of build identity, not an ordering comparison, so a
	hotfix carrying the same version and a different commit is `true`. An
	entry with nothing installed, one whose kind maps to no package-id and
	one whose package has no accepted build are all `false`.
	
	A `false` here is only "up to date" when `updateCheckFailed` is
	`false`; the two must be read together.
	
	# Errors
	
	Returns an error if the package deployer is missing from the GraphQL
	context. A failed lookup is not an error: it is reported through
	`updateCheckFailed`.
	"""
	updateAvailable: Boolean!
	"""
	Whether this response's lookup of the most recently accepted build for
	this entry's package failed.
	
	When it is `true`, `updateAvailable` is `false` because nothing was
	answered to compare against, and a client must not render that pair as
	"up to date". It is `false` for an entry that consulted no store at
	all: nothing was asked, so nothing failed.
	
	# Errors
	
	Returns an error if the package deployer is missing from the GraphQL
	context.
	"""
	updateCheckFailed: Boolean!
	"""
	Whether the trust generation active for this response withdraws the
	build installed for this entry.
	
	A withdrawn build is no longer served for new installs or updates, but
	stays installed where it already runs; the remedy is to update this
	entry to another build.
	
	A `false` here is "not withdrawn" only when `withdrawalCheckFailed` is
	`false`; the two must be read together. An entry with nothing installed
	and one whose kind maps to no package-id are both `false`, and consult
	nothing.
	
	# Errors
	
	Returns an error if the package deployer is missing from the GraphQL
	context. A failed check is not an error: it is reported through
	`withdrawalCheckFailed`.
	"""
	installedBuildWithdrawn: Boolean!
	"""
	Whether this response's check of whether this entry's installed
	build is withdrawn failed.
	
	It is `true` only when the check failed, and `installedBuildWithdrawn`
	is then `false` because nothing was answered; a client must not render
	that pair as "not withdrawn". An entry with nothing installed and one
	whose kind maps to no package-id are both `false`: nothing was asked,
	so nothing failed.
	
	# Errors
	
	Returns an error if the package deployer is missing from the GraphQL
	context.
	"""
	withdrawalCheckFailed: Boolean!
	"""
	The current operation attempt for this entry's own
	`(host, target, instance)`, or null if the triple has none.
	
	It is the running attempt where there is one, otherwise the attempt
	that still owes a compensation, otherwise the last one to finish. That
	ordering is `review-database`'s, not this crate's, so an attempt still
	owing a teardown is never hidden behind a newer one that finished.
	
	It is null for an entry whose kind maps to no package-id, which
	`TI_CONTAINER` is: there is no target to look an attempt up under.
	
	# Errors
	
	Returns an error if the node map or the ledger cannot be read.
	"""
	latestOperationAttempt: OperationAttempt
}

