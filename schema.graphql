"""
A set of mutations defined in the schema.
"""
type Mutation {
	"""
	Adds a new category.
	"""
	addCategory(name: String!): ID!
	"""
	Updates the given category's name.
	"""
	updateCategory(id: ID!, name: String!): ID!
	"""
	Updates the server certificate.
	"""
	updateCertificate(cert: String!, key: String!): CertificatePayload!
	"""
	Updates the given cluster.
	
	An unknown model is refused with `extensions.code` `NOT_FOUND`, and a
	model of none of the caller's customers with `Forbidden`.
	"""
	updateCluster(model: ID!, id: ID!, category: ID, qualifier: ID, status: ID): ID!
	"""
	Requests the deletion of a customer's data, or a retry of its stopped
	deletion.
	
	Refused before anything is written, with `extensions.code`
	`ENDPOINTS_ACTIVE`, while an entry of the active list, whatever its
	state, is one of the customer's Clumit Endpoint endpoints. The message
	names those endpoints.
	
	Refused the same way, with `DATA_STORE_IN_USE`, while a Data Store on
	one of the customer's nodes is named by an agent on another node, a
	training definition of another customer, or a system log collector,
	or has received data from an endpoint of another customer. The
	message names each such Data Store, its users, and how to free it.
	
	Refused the same way, with `CUSTOMER_DATA_ALREADY_DELETED`, when the
	customer's data was already deleted and it holds nodes, time series
	generation policies, models or training definitions created since.
	Once they are removed, the request is answered `ALREADY_COMPLETED`.
	
	`abandonHosts` and `abandonDataStores` give up, on a retry of a
	stopped deletion, hosts and Data Stores that are gone for good. The
	Central Manager never decides on its own that one is gone. Each host
	is a host of the deletion; each Data Store is the server name of a
	`DATA_STORE` result that is `FAILED`. Nothing is sent to them again,
	and their work is recorded `SUCCEEDED` with an error text starting
	"abandoned: " that names what is left on the host. The modules
	installed on a given-up host are given up without reaching it. Left
	out or empty, the lists change nothing, and duplicates are dropped.
	
	A request naming either is refused before anything is written, with
	no `extensions.code`: while the deletion runs, with "the deletion is
	still running; give up hosts or Data Stores only once it has stopped";
	and when there is no stopped deletion to retry, or a host or a Data
	Store is outside it, with "abandonHosts and abandonDataStores apply
	only to retrying a failed deletion, and only to its hosts and failed
	Data Stores".
	"""
	deleteCustomerData(customerId: ID!, abandonHosts: [String!], abandonDataStores: [String!]): CustomerDataDeletionRequestStatus!
	backup(numOfBackupsToKeep: Int!): Boolean!
	restoreFromLatestBackup: Boolean!
	"""
	Restores the database from a specific backup by ID.
	
	# Errors
	
	This function will return an error if:
	* The backup ID does not exist
	* The restore operation fails (e.g., corrupted backup, I/O errors)
	* Database is locked by another operation
	"""
	restoreFromBackup(id: ID!): Boolean!
	"""
	Sets or creates a new backup configuration.
	
	This mutation creates or overwrites the backup configuration with the
	provided values. Only `SystemAdministrator` can modify the backup
	configuration.
	
	# Arguments
	
	* `input` - The backup configuration input containing:
	- `backup_duration`: Interval between backups in days (must be >= 1)
	- `backup_time`: Scheduled backup time in HH:MM:SS UTC format
	- `num_of_backups_to_keep`: Maximum retained backup snapshots (must be >= 1)
	
	# Errors
	
	Returns an error if:
	* The user is not a `SystemAdministrator`
	* Input validation fails (e.g., invalid time format, zero values)
	* Database operation fails
	"""
	setBackupConfig(input: BackupConfigInput!): BackupConfig!
	"""
	Updates the existing backup configuration.
	
	This mutation updates the backup configuration from the old values to
	new values. Both old and new configurations must be provided for
	optimistic concurrency control. Only `SystemAdministrator` can modify
	the backup configuration.
	
	# Arguments
	
	* `old` - The current backup configuration (for verification)
	* `new` - The new backup configuration to apply
	
	# Errors
	
	Returns an error if:
	* The user is not a `SystemAdministrator`
	* The old configuration doesn't match the current stored configuration
	* Input validation fails (e.g., invalid time format, zero values)
	* Database operation fails
	"""
	updateBackupConfig(old: BackupConfigInput!, new: BackupConfigInput!): BackupConfig!
	"""
	Asks the engine instance `agentKey` of node `nodeId` to run one round
	of its detector `detectorId` now, returning `true` once the instance
	accepts.
	
	A detector of the applied document is relayed whether or not it is
	enabled. Scope is the node's customer: a node of none of the caller's
	customers is refused with `Forbidden`, and an unknown node with
	`no such node`.
	
	Refusals carry `extensions.code`: `INSTANCE_NOT_ELIGIBLE`;
	`INSTANCE_STOPPED` for a stopped instance; `DETECTOR_NOT_FOUND` for a
	`detectorId` that is not an id of the applied document, with
	`detectorId` when it is an integer; and, with `detectorId`,
	`ENGINE_REFUSED` with the engine's reason in `value` (a round is
	running, or the detector is paused for a run) or
	`INSTANCE_UNREACHABLE` when the request did not reach the instance or
	the instance was stopped meanwhile.
	"""
	runDetectorOnce(nodeId: ID!, agentKey: String!, detectorId: ID!): Boolean!
	"""
	Starts the engine instance `agentKey` of node `nodeId` through the
	node's Host Agent, returning `true` once the Host Agent confirms.
	
	The instance fetches its engine document itself when it starts. Scope
	is the node's customer: a node of none of the caller's customers is
	refused with `Forbidden`, and an unknown node with `no such node`.
	
	Refusals carry `extensions.code`: `INSTANCE_NOT_ELIGIBLE`, and
	`INSTANCE_UNREACHABLE` when the start did not complete, with the
	backend's error text as the message.
	"""
	startEngineInstance(nodeId: ID!, agentKey: String!): Boolean!
	"""
	Stops and disables the engine instance `agentKey` of node `nodeId`
	through the node's Host Agent, returning `true` once the Host Agent
	confirms.
	
	Scope is the node's customer: a node of none of the caller's customers
	is refused with `Forbidden`, and an unknown node with `no such node`.
	
	Refusals carry `extensions.code`: `INSTANCE_NOT_ELIGIBLE`, and
	`INSTANCE_UNREACHABLE` when the stop did not complete, with the
	backend's error text as the message.
	"""
	stopEngineInstance(nodeId: ID!, agentKey: String!): Boolean!
	"""
	Registers a customer for Clumit Endpoint with its trust anchor: the
	customer endpoint id, the customer key name, the install the customer
	belongs to and the first keyset JWS.
	"""
	registerEndpointCustomer(customerId: ID!, customerEndpointId: ID!, keyName: String!, installId: String!, keyset: String!): Boolean!
	"""
	Registers a Clumit Endpoint install with its first recovery public key,
	a JWK as JSON text, and that key's version.
	"""
	registerEndpointInstall(installId: String!, recoveryKey: String!, version: StringNumber!): Boolean!
	"""
	Applies an active list update and returns the version applied.
	
	`update` is the CBOR bytes of senta-protocol's `ListUpdate::encode` as
	standard padded base64; a full list and a diff are told apart inside
	it.
	"""
	setEndpointActiveList(update: String!): StringNumber!
	"""
	Puts signed documents, and returns one result per document in input
	order.
	
	A refused document fails neither the call nor another document; its
	`reason` is the code of its refusal.
	"""
	putEndpointDocuments(documents: [String!]!): [SentaEndpointDocumentResult!]!
	"""
	Resolves an enrollment attempt, keyed by the SPKI hash of the
	enrolling endpoint (64 lowercase hexadecimal characters) and the
	attempt id.
	
	Approving an attempt of a customer with a data deletion job is
	refused, with `CUSTOMER_DELETION_IN_PROGRESS` or
	`CUSTOMER_DATA_ALREADY_DELETED`.
	"""
	resolveEndpointEnrollment(spkiHash: String!, attemptId: ID!, resolution: SentaEndpointEnrollmentResolution!): Boolean!
	"""
	Submits a signed command and returns its command id.
	"""
	submitEndpointCommand(command: String!): ID!
	"""
	Replaces the networks the customer owns with `networks`, returning the
	stored revision.
	
	`networks` is the customer's full set; an empty list means it owns
	none. A `revision` lower than the stored one is refused with the error
	code `STALE_REVISION`, whose `storedRevision` extension holds the stored
	revision.
	
	Once the networks are stored, every Time Series Generator holding an
	assigned time series generation policy of the customer is told that
	its policies changed, since a policy is sent with its customer's
	internal networks.
	"""
	replaceCustomerNetworks(customerId: ID!, revision: StringNumber!, networks: [OwnedNetworkInput!]!): StringNumber!
	"""
	Removes the networks the customer owns, returning whether any were
	stored.
	
	Once stored networks are removed, every Time Series Generator holding
