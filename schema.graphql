type ClusterTrend {
	clusterId: ID!
	series: [TimeCount!]!
	"""
	The cluster trend as string-represented `usize` counts. Negative values
	become 0; otherwise values round to the nearest integer, with exact halves
	toward the larger integer. Line segments and statistics use the untruncated
	trend and may differ from those recomputed from these integer values:
	`[1.1, 1.2]` has a positive slope while the integer trend is `["1", "1"]`.
	"""
	trend: [StringNumber!]!
	lines: [LineSegment!]!
	"""
	The number of ups of cluster trend in string represantable by a `
	usize`.
	"""
	numberOfUps: StringNumber!
	"""
	The number of downs of cluster trend in string represantable by a
	`usize`.
	"""
	numberOfDowns: StringNumber!
	maximumSlope: Float!
	minimumSlope: Float!
	"""
	The longest up span of cluster trend in string represantable by a
	`usize`.
	"""
	longestUpSpan: StringNumber!
	"""
	The longest down span of cluster trend in string represantable by a
	`usize`.
	"""
	longestDownSpan: StringNumber!
}

"""
How a clustering model type groups raw events.
"""
enum ClusteringApproach {
	"""
	Groups raw events by the leading tokens of their prefix columns.
	"""
	PREFIX
	"""
	Groups raw events around centroids of their feature vectors.
	"""
	CENTROID
}

"""
A clustering model type: a fixed recipe for training a clustering model on
one raw event kind.
"""
type ClusteringModelType {
	"""
	The snake-case identifier, never changed; a definition names it in
	`type`.
	"""
	id: String!
	"""
	The current version, raised whenever the fixed values or the allowed
	detection models change; a definition names it in `type_version`.
	"""
	version: StringNumber!
	"""
	The position in the catalog.
	"""
	order: StringNumber!
	"""
	The kind of the raw events the model reads.
	"""
	rawEventKind: RawEventKind!
	"""
	The clustering method.
	"""
	method: ModelMethod!
	"""
	How the model groups raw events.
	"""
	approach: ClusteringApproach!
	"""
	The source identifier's kind and raw-event column name.
	"""
	sourceColumn: SourceColumn!
	"""
	The recipe's fixed OS family, or null for a recipe without one.
	"""
	osFamily: String
	"""
	The top-level definition keys the type fixes, with their values, in
	catalog order. `csv` is one entry, its value an inline table.
	"""
	fixedValues: [TrainingValue!]!
	"""
	The definition values the operator sets, in catalog order.
	"""
	operatorValues: [TrainingOperatorValue!]!
	"""
	The shortest training window, from `window_start` to `window_end`, in
	seconds; null when the type sets no minimum.
	"""
	minWindowSeconds: Int
	"""
	The detection models allowed to run on the model, in detection model
	number order.
	"""
	detectionModels: [DetectionModel!]!
	"""
	What the type groups and what its limits are, in English.
	"""
	descriptionEn: String!
	"""
	What the type groups and what its limits are, in Korean.
	"""
	descriptionKo: String!
}

"""
The clustering model type a training definition or a model names, or a
