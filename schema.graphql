type UnusualDestinationPattern implements Event {
	"""
	Opaque event identifier.
	"""
	id: ID!
	"""
	Event Generation Time
	"""
	time: DateTime!
	"""
	Sensor
	"""
	sensor: String!
	"""
	Start boundary of the anomaly sampling window used for detection.
	"""
	samplingWindowStartTime: DateTime!
	"""
	End boundary of the anomaly sampling window used for detection.
	"""
	samplingWindowEndTime: DateTime!
	"""
	Responder IP (Address) List
	"""
	respAddrs: [String!]!
	"""
	Responder Country List
	
	The two-letter country codes recorded for the responder IP addresses,
	one per address in the same order. Each code is `"ZZ"` if the country
	could not be determined for that address, or `"XX"` if no country
	information was recorded for this event.
	"""
	respCountries: [String!]!
	"""
	Responder Network
	"""
	respNetwork: Network
	"""
	Count of connections
	"""
	count: Int!
	"""
	Expected mean of connections
	"""
	expectedMean: Float!
	"""
	Standard deviation of connections
	"""
	stdDeviation: Float!
	"""
	Z-score indicating how many standard deviations the count is from the
	mean
	"""
	zScore: Float!
	"""
	Confidence
	"""
	confidence: Float!
	"""
	MITRE Tactic
	"""
	category: ThreatCategory
	"""
	Triage Scores
	"""
	triageScores: [TriageScore!]
	"""
	Threat Level
	"""
	level: ThreatLevel!
	"""
	Learning Method
	"""
	learningMethod: LearningMethod!
}

"""
What `updateCoreComponent` answers with.
"""
union UpdateCoreComponentResult = UpdateCoreComponentSuccess | CleanupPending | RollbackUnsupported | BuildNotServable | ManifestFormatUnsupported

"""
A core-component update was accepted, and this is the operation to poll.
"""
type UpdateCoreComponentSuccess {
	"""
	The attempt's durable identity.
	"""
	operationId: String!
	"""
	Whether the apply finished or was accepted for later reconciliation.
	"""
	disposition: DeployDisposition!
}

"""
What `updateService` answers with.

An update allocates nothing, so neither bind-address conflict and no
request-key refusal is reachable from it.
"""
union UpdateServiceResult = UpdateServiceSuccess | CleanupPending | RollbackUnsupported | BuildNotServable | ManifestFormatUnsupported | SystemInstance

"""
The update was accepted, and this is the operation to poll.
"""
type UpdateServiceSuccess {
	"""
	The attempt's durable identity.
	"""
	operationId: String!
	"""
	Whether the apply finished or was accepted for later reconciliation.
	"""
	disposition: DeployDisposition!
}

"""
What `updateSystemLogCollector` answers with.

These are the members of `updateService`'s result except `SystemInstance`:
the collector is the system instance this mutation is for.
"""
union UpdateSystemLogCollectorResult = UpdateSystemLogCollectorSuccess | CleanupPending | RollbackUnsupported | BuildNotServable | ManifestFormatUnsupported

"""
The collector's update was accepted, and this is the operation to poll.
"""
type UpdateSystemLogCollectorSuccess {
	"""
	The attempt's durable identity.
	"""
	operationId: String!
	"""
	Whether the apply finished or was accepted for later reconciliation.
	"""
	disposition: DeployDisposition!
}

