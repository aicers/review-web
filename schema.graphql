"""
The Central Manager node and the upstream NTP servers of its host.
"""
type CentralManagerTimeSources {
	"""
	The ID of the Central Manager node, as `Node.id` and `NodeStatus.id`
	give it.
	"""
	nodeId: ID!
	"""
	The upstream NTP servers, in the order of the host's configuration
	file. chrony chooses among them by its own measurements; the order sets
	no preference. An empty list means none is set: the host then uses
	Ubuntu's default servers where reachable, and its own clock otherwise.
	"""
	servers: [String!]!
}

type CertificatePayload {
	parsedCertificate: [ParsedCertificate!]!
}

"""
A teardown is still owed on the target, so a new operation on it cannot
start.

It is a mutation result rather than a read field because a client that read
the owed cleanup a moment earlier can still lose the race, and the
operation id is what lets a screen point at the cleanup instead of saying
"try again later".
"""
type CleanupPending {
	"""
	The host the teardown is owed on.
	"""
	host: String!
	"""
	The package-id the teardown is owed for.
	"""
	target: String!
	"""
	The instance the teardown is owed for. It is null when the refused
	install never allocated one.
	"""
	instance: StringNumber
	"""
	The operation that owes it.
	"""
	operationId: String!
}

