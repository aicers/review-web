"""
GraphQL output type for backup configuration settings.

This type represents the current backup configuration including:
- `backup_duration`: Interval between backups in days (minimum: 1)
- `backup_time`: Scheduled backup execution time in HH:MM:SS UTC format
- `num_of_backups_to_keep`: Maximum number of retained backup snapshots (minimum: 1)
"""
type BackupConfig {
	"""
	Interval between backups in days. Minimum value is 1.
	"""
	backupDuration: Int!
	"""
	Scheduled backup execution time in HH:MM:SS UTC format.
	"""
	backupTime: String!
	"""
	Maximum number of retained backup snapshots. Minimum value is 1.
	"""
	numOfBackupsToKeep: Int!
}

"""
GraphQL input type for creating or updating backup configuration.

All fields are required:
- `backup_duration`: Interval between backups in days (must be >= 1)
- `backup_time`: Scheduled backup execution time in HH:MM:SS UTC format
- `num_of_backups_to_keep`: Maximum number of retained backup snapshots (must be >= 1)
"""
input BackupConfigInput {
	"""
	Interval between backups in days. Must be >= 1.
	"""
	backupDuration: Int!
	"""
	Scheduled backup execution time in HH:MM:SS UTC format (e.g., "23:59:59").
	"""
	backupTime: String!
	"""
	Maximum number of retained backup snapshots. Must be >= 1.
	"""
	numOfBackupsToKeep: Int!
}

type BackupInfo {
	id: ID!
	timestamp: DateTime!
	size: StringNumber!
}

"""
Who holds an allocated address.

It carries no listener key: the contended row's key is rendered by the
conflict itself.
"""
type BindAddrHolder {
	"""
	The canonical package-id of the component holding the address.
	"""
	component: String!
	"""
	The instance number holding it. It is a `u32` upstream, which `Int`
	cannot represent, so it crosses as the `StringNumber` scalar.
	"""
	instance: StringNumber!
}

"""
One address an operator submits with an install.

There is no `transport` field: transport is never operator input.
"""
input BindAddrInput {
	"""
	The name the component knows the listener by, passed through unchecked.
	"""
	listenerKey: String!
	"""
	The address to bind, as `<ip>:<port>`.
	"""
	addr: String!
}

"""
One address review proposes for one listener.

There is deliberately no `editable` flag: it could never be false, and the
fields an operator may not change are read from the allocation row rather
than from a proposal.
"""
type BindAddrProposal {
	"""
	The name the component knows the listener by.
	"""
	listenerKey: String!
	"""
	The transport the listener binds on.
	"""
	transport: Transport!
	"""
	The proposed address, as `<ip>:<port>`.
	"""
	addr: String!
}

"""
The addresses review would choose for the next instance of a component.
"""
type BindAddrProposals {
	"""
	One proposal per listener the component binds, in review's own order.
	It is empty for every component with no listeners of its own, which is
	an ordinary answer rather than a failure.
	"""
	proposals: [BindAddrProposal!]!
}

type BootpBody {
	origAddr: String!
	origPort: Int!
	respAddr: String!
	respPort: Int!
	proto: Int!
	startTime: StringNumber!
	duration: StringNumber!
	origPkts: StringNumber!
	respPkts: StringNumber!
	origL2Bytes: StringNumber!
	respL2Bytes: StringNumber!
	op: Int!
	htype: Int!
	hops: Int!
	xid: StringNumber!
	ciaddr: String!
	yiaddr: String!
	siaddr: String!
	giaddr: String!
	chaddr: [Int!]!
	sname: String!
	file: String!
}

"""
An address a running instance reports it is bound to.

This is observed state, refreshed on every status report, so it stays
correct after an operator moves a port through the configuration plane. It
is deliberately not the shape a bind-address *proposal* takes: a proposal
is what `REview` would choose for an install that has not happened, and
nothing may assume the two key spaces coincide.
"""
type BoundAddr {
	"""
	The configuration key of the listener.
	"""
	key: String!
	"""
	The `host:port` the listener is bound to.
	"""
	addr: String!
}

"""
The store will not serve the build the request selected.

It typically means the build was withdrawn between reading the build list
and submitting, though a build that no longer matches the selector, or one
that is unverified or changed, is refused the same way. The remedy is to
refresh the build list and choose another build. A store that could not be
read is not this: that is an ordinary GraphQL error, retried as submitted.
"""
type BuildNotServable {
	"""
	The package-id the selection was for.
	"""
	target: String!
}

"""
The build the operator asked for: exactly one field is set.

GraphQL has no input union, so the two alternatives cross as nullable
fields and a submission setting both or neither is refused.
"""
input BuildSelectorInput {
	"""
	A version, which resolves to the release build of that version (the
	more recently accepted one if the store holds two), never to a test
	build. A version with no servable release build is refused.
	"""
	version: String
	"""
	An exact commit, naming one build, release or test. It is the only way
	to select a test build.
	"""
	commit: String
}

