type Agent {
	nodeId: Int!
	key: String!
	kind: AgentKind!
	status: AgentStatus!
	config: String
	draft: String
	"""
	The version of the build installed on the host, as the host reports it.
	
	An opaque display label that is not required to be semver. It is null
	together with `installedCommit` or not at all: the two are one build
	identity, and half of one names no build. Null does not by itself mean
	nothing is installed — a row written before the field existed, or one
	whose host has not reported yet, carries null under any lifecycle.
	"""
	installedVersion: String
	"""
	The commit of the build installed on the host, as the host reports it.
	
	Null together with `installedVersion` or not at all.
	"""
	installedCommit: String
	"""
	The install and run state of the build on the host, or null if the
	entry's kind maps to no package-id.
	
	That null is the discriminator between the two absences: a
	package-managed entry with nothing installed reports `NOT_INSTALLED`,
	which asserts that something *could* be installed here, while null says
	no package deploys this kind at all.
	"""
	lifecycle: Lifecycle
	"""
	The applied "run as root" switch.
	"""
	runAsRoot: Boolean!
	"""
	The unapplied "run as root" switch change, or null when there is none.
	"""
	runAsRootDraft: Boolean
	"""
	The privilege profile the host last confirmed applying, or null for a
	Sensor whose build declares no profiles or that was never confirmed.
	"""
	privilegeProfile: String
	"""
	The instance number this entry is, rendered as a decimal string.
	
	It is a `StringNumber` rather than an `Int` because the stored number
	is a `u32`, whose upper half has no valid `Int` representation. Null
	means the entry has no instance dimension or was written before any
	number was recorded.
	"""
	instance: StringNumber
	"""
	The privilege profile the Sensor's stored configuration and stored "run
	as root" switch derive, which `applyAgentConfig` would re-apply when it
	differs from `privilegeProfile`.
	
	It reads `config` and `runAsRoot`, never `draft` or `runAsRootDraft`.
	A Sensor whose value is not null and differs from `privilegeProfile` is
	exactly one that the next `applyAgentConfig` naming it re-applies. Null
	for any agent other than a Sensor, for a Sensor whose `privilegeProfile`
	is null, and for a configuration that selects no single input mode.
	"""
	desiredPrivilegeProfile: String
	"""
	Whether the store holds a build newer than the one installed for this
	entry that counts as an update of it.
	
	With a release build installed, only a newer release build counts (a
	test build of the same version does not); with a test build
	installed, or a build the store does not serve, any newer build
	counts, release or test. An older build never does. It is `false`
	for an entry with nothing installed and for one whose kind maps to
	no package-id.
	
	A `false` here is only "up to date" when `updateCheckFailed` is
	`false`; the two must be read together.
	
	# Errors
	
	Returns an error if the package deployer is missing from the GraphQL
	context. A failed lookup is not an error: it is reported through
	`updateCheckFailed`.
	"""
	updateAvailable: Boolean!
	"""
	Whether this response's lookup of an update for the build installed for
	this entry failed.
	
	When it is `true`, `updateAvailable` is `false` because nothing was
	answered to compare against, and a client must not render that pair as
	"up to date". It is `false` for an entry that consulted no store at
	all: nothing was asked, so nothing failed.
	
	# Errors
	
	Returns an error if the package deployer is missing from the GraphQL
	context.
	"""
	updateCheckFailed: Boolean!
	"""
	Whether the trust generation active for this response withdraws the
	build installed for this entry.
	
	A withdrawn build is no longer served for new installs or updates, but
	stays installed where it already runs; the remedy is to update this
	entry to another build.
	
	A `false` here is "not withdrawn" only when `withdrawalCheckFailed` is
	`false`; the two must be read together. An entry with nothing installed
	and one whose kind maps to no package-id are both `false`, and consult
	nothing.
	
	# Errors
	
	Returns an error if the package deployer is missing from the GraphQL
	context. A failed check is not an error: it is reported through
	`withdrawalCheckFailed`.
	"""
	installedBuildWithdrawn: Boolean!
	"""
	Whether this response's check of whether this entry's installed
	build is withdrawn failed.
	
	It is `true` only when the check failed, and `installedBuildWithdrawn`
	is then `false` because nothing was answered; a client must not render
	that pair as "not withdrawn". An entry with nothing installed and one
	whose kind maps to no package-id are both `false`: nothing was asked,
	so nothing failed.
	
	# Errors
	
	Returns an error if the package deployer is missing from the GraphQL
	context.
	"""
	withdrawalCheckFailed: Boolean!
	"""
	The current operation attempt for this entry's own
	`(host, target, instance)`, or null if the triple has none.
	
	It is the running attempt where there is one, otherwise the attempt
	that still owes a compensation, otherwise the last one to finish. That
	ordering is `review-database`'s, not this crate's, so an attempt still
	owing a teardown is never hidden behind a newer one that finished.
	
	It is null for an entry whose kind maps to no package-id: there is no
	target to look an attempt up under.
	
	# Errors
	
	Returns an error if the node map or the ledger cannot be read.
	"""
	latestOperationAttempt: OperationAttempt
}

"""
Why a Sensor's privileges did not change. Each value is terminal: retrying the same apply cannot
succeed until the operator changes something.
"""
enum AgentApplyErrorCode {
	"""
	The Sensor's input settings select no single privilege profile. Terminal: retrying the same
	apply cannot succeed until the operator changes something.
	"""
	PROFILE_CLASSIFICATION
	"""
	The re-apply was refused before the host changed anything. Terminal: retrying the same apply
	cannot succeed until the operator changes something.
	"""
	PROFILE_REFUSED
	"""
	The host did not apply the new privilege profile, and the Sensor keeps its previous unit.
	Terminal: retrying the same apply cannot succeed until the operator changes something.
	"""
	REAPPLY_ROLLED_BACK
}

input AgentDraftInput {
	kind: AgentKind!
	"""
	Agent identity segment combined with the node profile hostname to form the
	runtime agent lookup key used for routing and notifications.
	
	Use `{instance}.{service}` (e.g. `001.hog`, `002.hog`), matching the
	certificate identity prefix before the DNS SAN hostname.
	"""
	key: String!
	status: AgentStatus!
	draft: String
	"""
	The unapplied "run as root" switch change, or null when there is none.
	Refused on an agent whose kind is not `SENSOR`.
	"""
	runAsRootDraft: Boolean
}

input AgentInput {
	kind: AgentKind!
	"""
	Agent identity segment combined with the node profile hostname to form the
	runtime agent lookup key used for routing and notifications.
	
	Use `{instance}.{service}` (e.g. `001.hog`, `002.hog`), matching the
	certificate identity prefix before the DNS SAN hostname.
	"""
	key: String!
	status: AgentStatus!
	config: String
	draft: String
	"""
	The applied "run as root" switch, as read from the node. A client that
	does not send it sends `false`.
	"""
	runAsRoot: Boolean! = false
	"""
	The unapplied "run as root" switch change, as read from the node, or
	null when there is none.
	"""
	runAsRootDraft: Boolean
}

enum AgentKind {
	UNSUPERVISED
	SENSOR
	SEMI_SUPERVISED
	TIME_SERIES_GENERATOR
	LOG_COLLECTOR
}

type AgentNotifyAttempt {
	"""
	The bare key of the agent (`Agent.key`) or of the Giganto external service
	(`ExternalService.key`).
	"""
	agentKey: String!
	"""
	`true` if the manager accepted the notify request. Does not imply that the agent has
	already applied the new config.
	
	For a re-applied Sensor, `true` means review accepted the re-apply and it either finished
	or is still settling; like a notification, it does not by itself mean the Sensor already
	runs with the new profile, which `Agent.privilegeProfile` shows once review records what the
	host confirmed.
	"""
	succeeded: Boolean!
	"""
	Populated only when `succeeded` is `false`.
	"""
	error: String
	"""
	Set only when `succeeded` is `false` and retrying the same apply cannot succeed. Null for
	every other failure, which stays retryable.
	"""
	errorCode: AgentApplyErrorCode
}

"""
One agent of a node, as the status read path renders it.

It carries the same install state `Agent` does, because `nodeStatusList` is
one of the two routes that state has to be readable on. It stays a
snapshot rather than becoming an `Agent`: the configuration payload and the
node identity belong to the list path, not to a status poll. `instance` is
what tells two rows of one kind on one host apart here, since a snapshot
carries no `key`.
"""
type AgentSnapshot {
	kind: AgentKind!
	storedStatus: AgentStatus!
	"""
	Serialized TOML string containing the configuration of the agent.
	"""
	config: String
	"""
	Serialized TOML string containing the draft configuration of the agent.
	"""
	draft: String
	"""
	The version of the build installed on the host, as the host reports it.
	
	An opaque display label that is not required to be semver. It is null
	together with `installedCommit` or not at all.
	"""
	installedVersion: String
	"""
	The commit of the build installed on the host, as the host reports it.
	
	Null together with `installedVersion` or not at all.
	"""
	installedCommit: String
	"""
	The install and run state of the build on the host, or null if the
	entry's kind maps to no package-id.
	"""
	lifecycle: Lifecycle
	"""
	The instance number this entry is, rendered as a decimal string.
	
	It is a `StringNumber` rather than an `Int` because the stored number
	is a `u32`, whose upper half has no valid `Int` representation.
	"""
	instance: StringNumber
	"""
	Whether the store holds a build newer than the one installed for this
	entry that counts as an update of it.
	
	With a release build installed, only a newer release build counts (a
	test build of the same version does not); with a test build
	installed, or a build the store does not serve, any newer build
	counts, release or test. An older build never does. It is `false`
	for an entry with nothing installed and for one whose kind maps to
	no package-id.
	
	A `false` here is only "up to date" when `updateCheckFailed` is
	`false`; the two must be read together.
	
	# Errors
	
	Returns an error if the package deployer is missing from the GraphQL
	context. A failed lookup is not an error: it is reported through
	`updateCheckFailed`.
	"""
	updateAvailable: Boolean!
	"""
	Whether this response's lookup of an update for the build installed for
	this entry failed.
	
	When it is `true`, `updateAvailable` is `false`, and a client must not
	render that pair as "up to date".
	
	# Errors
	
	Returns an error if the package deployer is missing from the GraphQL
	context.
	"""
	updateCheckFailed: Boolean!
	"""
	Whether the trust generation active for this response withdraws the
	build installed for this entry.
	
	A withdrawn build is no longer served for new installs or updates, but
	stays installed where it already runs; the remedy is to update this
	entry to another build.
	
	A `false` here is "not withdrawn" only when `withdrawalCheckFailed` is
	`false`; the two must be read together. An entry with nothing installed
	and one whose kind maps to no package-id are both `false`, and consult
	nothing.
	
	# Errors
	
	Returns an error if the package deployer is missing from the GraphQL
	context. A failed check is not an error: it is reported through
	`withdrawalCheckFailed`.
	"""
	installedBuildWithdrawn: Boolean!
	"""
	Whether this response's check of whether this entry's installed
	build is withdrawn failed.
	
	It is `true` only when the check failed, and `installedBuildWithdrawn`
	is then `false` because nothing was answered; a client must not render
	that pair as "not withdrawn". An entry with nothing installed and one
	whose kind maps to no package-id are both `false`: nothing was asked,
	so nothing failed.
	
	# Errors
	
	Returns an error if the package deployer is missing from the GraphQL
	context.
	"""
	withdrawalCheckFailed: Boolean!
}

