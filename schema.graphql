type Subscription {
	"""
	A stream of detection events with timestamp on or after `start`.
	
	Each detection model is tracked on its own: a poll delivers, in key
	order, every event whose time is at or after its model's next-delivery
	time, and delivering an event moves only that model's time, to just
	past the event's time.
	"""
	eventStream(		start: DateTime!,
		"""
		The fetch interval in seconds, from 1 to 86400 (one day) inclusive. Omitted or null values use 20 seconds.
		"""
		fetchInterval: Int,		eventStuckCheckInterval: Int
	): DetectionEvent!
	"""
	Streams the outliers stored from `start` on, of the models that belong
	to the customers the caller had when the subscription started.
	
	Each fetch reads at most 100 models, counted among those models only.
	"""
	rankedOutlierStream(		start: DateTime!,
		"""
		The fetch interval in seconds, from 1 to 86400 (one day) inclusive. Omitted or null values use 60 seconds.
		"""
		fetchInterval: Int
	): RankedOutlier!
}

