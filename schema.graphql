"""
An address a running instance reports it is bound to.

This is observed state, refreshed on every status report, so it stays
correct after an operator moves a port through the configuration plane. It
is deliberately not the shape a bind-address *proposal* takes: a proposal
is what `REview` would choose for an install that has not happened, and
nothing may assume the two key spaces coincide.
"""
type BoundAddr {
	"""
	The configuration key of the listener.
	"""
	key: String!
	"""
	The `host:port` the listener is bound to.
	"""
	addr: String!
}

"""
The store will not serve the build the request selected.

It typically means the build was withdrawn between reading the build list
and submitting, though a build that no longer matches the selector, or one
that is unverified or changed, is refused the same way. The remedy is to
refresh the build list and choose another build. A store that could not be
read is not this: that is an ordinary GraphQL error, retried as submitted.
"""
type BuildNotServable {
	"""
	The package-id the selection was for.
	"""
	target: String!
}

"""
The build the operator asked for: exactly one field is set.

GraphQL has no input union, so the two alternatives cross as nullable
fields and a submission setting both or neither is refused.
"""
input BuildSelectorInput {
	"""
	A version, which review turns into a build.
	"""
	version: String
	"""
	An exact commit.
	"""
	commit: String
}

