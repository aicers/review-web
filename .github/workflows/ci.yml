# CHANGE FILTER: `changes` classifies the run's diff and the expensive jobs
# gate on its `docs_only` output, so a pull request that only touches inert
# documentation does not build and test the crate across the operating-system
# matrix. `markdown` is deliberately ungated — a docs-only change
# is exactly the change that needs the Markdown lint to run.
#
# THE GATE IS FAIL-CLOSED. Each gated job's `if:` runs the job whenever the
# filter did not positively report docs-only, including when the filter itself
# failed. Without `!cancelled()` a failing `changes` would skip its dependants
# instead, and GitHub counts a skipped required status check as a pass — so a
# broken filter would wave an untested change through. Detection must fail red,
# never open.
#
# `CI Gate` IS THE REQUIRED STATUS CHECK, not the individual jobs. A matrix job
# skipped at the job level is never expanded, so a docs-only run reports
# `test`, not `test (ubuntu-latest)` — and a protection rule naming
# the expanded contexts would wait forever for statuses that are never coming.
# `CI Gate` always reports, under one stable name, and it also stops protection
# from having to track matrix leg names at all.

name: CI

# TRIGGERS: `push` is scoped to `main`. Without a branch filter it also matches
# pushes to pull-request branches, which already match `pull_request`, so every
# job ran twice per commit, on two separate workflow runs. Naming `branches:`
# also stops tag pushes from matching. `pull_request` checks out the branch
# already merged into its base, so merge coverage is not what is being dropped
# here — the one thing lost is CI on a branch with no pull request open, and
# `workflow_dispatch` replaces it (`gh workflow run ci.yml --ref <branch>`).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && '-dispatch' || (github.run_attempt != '1' && format('-rerun-{0}', github.run_id) || '') }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Change Filter
    runs-on: ubuntu-latest
    # Scoped to this job alone. The filter only reads the checked-out
    # history, so `contents: read` is all it needs. Declaring the block here
    # rather than at workflow level leaves every other job's token exactly
    # as it is today.
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs-only }}
    steps:
      # The full history, because the action diffs locally and does not
      # fetch: a pull request against its merge-base with the base branch,
      # a push to `main` against `github.event.before`, and a dispatched
      # branch against its merge-base with `main`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `docs-paths` is the documentation allowlist that AGENTS.md points
      # agents at, on top of the action's built-in list (`*.md`, `LICENSE`,
      # `.agent-instructions.toml`, `.markdownlint*`). `not-docs-paths`
      # names every path a build or a test reads, and wins over the
      # allowlist.
      #
      # Docs-only requires a POSITIVE result: every changed path is on the
      # allowlist and none is on `not-docs-paths`, so a path in neither list
      # falls through to the full suite. This is an allowlist of the inert,
      # not a denylist. Anything the action cannot establish also runs the
      # full suite.
      #
      # The shared-instructions pin is inert to the build; only the drift
      # check reads it, and that runs in the ungated `markdown`.
      #
      # `tests/schema_sdl.rs` compares the generated SDL with the committed
      # `schema.graphql` through `include_str!`.
      - id: scope
        uses: aicers/agent-instructions/change-scope@main
        with:
          docs-paths: |
            docs/**
            **/*.md
            LICENSE
            .markdownlint*
            .agent-instructions.toml
          not-docs-paths: |
            src/**
            tests/**
            examples/**
            Cargo.toml
            .clippy.toml
            schema.graphql
            .github/workflows/**

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        id: checkout
      # No `globs` input. The `globs` and `ignores` of the root
      # `.markdownlint-cli2.yaml` are the one place that decides which files
      # are linted, here and in a local bare `markdownlint-cli2` alike; they
      # are recursive, so `docs/**` is linted. The action's default
      # `*.{md,markdown}` is only added to them and changes nothing. A
      # docs-only change skips every other job, so this is the only check
      # it gets.
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v25

      # The shared instruction-block drift check, which used to be a job of
      # its own calling `check-drift.yml` as a reusable workflow. Actions is
      # free on a public repository, so nothing was being billed for it;
      # what it cost was a job -- a scheduling slot, a row in every run, and
      # an entry in `gate`'s `needs:` -- for nine seconds of byte
      # comparison. As a step it runs inside a job that already exists, and
      # the fleet's other consumers carry it the same way.
      #
      # It belongs in THIS job and nowhere above, because it must not
      # inherit the `docs_only` gate. `Change Filter` counts `*.md` as inert
      # and AGENTS.md is a `.md` file, so a pull request that edits only a
      # generated region is docs-only by that reckoning -- a gated step
      # would skip the check on precisely the changes that cause drift. This
      # job asks the filter nothing, which is what makes it the right host.
      #
      # `@main`, as the workflow reference was. The scripts are mechanism
      # and come from wherever this reference points; the blocks are content
      # and come from the pin in `.agent-instructions.toml`. Pinning the
      # action to a release would freeze the check's implementation at
      # whatever shipped beside those blocks.
      #
      # No `with:` block. The release to compare against and the blocks to
      # compare are both read from `.agent-instructions.toml`, so they have
      # one source rather than two that can disagree, and the apply job that
      # rewrites them never has to touch `.github/workflows/` -- which the
      # default GITHUB_TOKEN may not push to. The pin is a release tag
      # rather than a branch, so an edit upstream reaches this repository
      # through the pull request that moves it instead of turning every
      # unrelated pull request red.
      #
      # Guarded rather than left to the default `success()`, which would
      # skip this step whenever a step above it failed. The checks are
      # independent -- a drifted block is drift whether or not some other
      # file also breaks a lint rule -- and as separate jobs they both
      # always reported. A short-circuit here would hide drift on precisely
      # the changes that touch the most Markdown, and would report it only
      # after a later push had fixed something unrelated.
      #
      # `!cancelled()` rather than `always()`: a cancelled run should stop,
      # not keep checking. The `checkout` clause is what keeps a failed
      # checkout from being reported as drift -- the action fails outright
      # when it cannot read `.agent-instructions.toml`, and in an empty
      # workspace that message names the pin for a problem that is not the
      # pin's.
      - uses: aicers/agent-instructions/check-drift@main
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}

  check:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt -- --check --config group_imports=StdExternalCrate
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Check
        run: cargo check --examples

  test:
    runs-on: ${{ matrix.os }}
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set PQ_LIB_DIR
        if: runner.os == 'macOS'
        run: echo "PQ_LIB_DIR=$(brew --prefix libpq)/lib" >> $GITHUB_ENV
      - name: Build examples
        run: cargo build --examples --verbose
      - name: Run tests
        run: cargo test --verbose

  coverage:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Generate code coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        id: codecov
        uses: codecov/codecov-action@v7
        continue-on-error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: lcov.info
          fail_ci_if_error: true
      - name: Wait before Codecov retry
        if: steps.codecov.outcome == 'failure'
        run: sleep 30
      - name: Upload coverage to Codecov (retry)
        if: steps.codecov.outcome == 'failure'
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: lcov.info
          fail_ci_if_error: true

  # `always()`, deliberately, and not `!cancelled()`: a cancelled run would
  # otherwise skip this job, and GitHub counts a skipped required check as a
  # pass. Running through cancellation lets the assertions below see the
  # cancelled results and report red.
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [changes, markdown, check, test, coverage]
    if: ${{ always() }}
    steps:
      # A filter that errored is a defect, not a tolerable outcome. The gated
      # jobs did still run — their `if:` fails closed — but the breakage has to
      # be visible rather than absorbed.
      - name: Assert the change filter succeeded
        if: ${{ needs.changes.result != 'success' }}
        run: |
          echo "Change Filter: ${{ needs.changes.result }}" >&2
          exit 1

      # `skipped` is a pass here, and only here: it is what a gated job reports
      # on a docs-only change. `cancelled` is not.
      - name: Assert every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "${RESULTS}"
          bad="$(printf '%s' "${RESULTS}" \
            | jq -r 'to_entries[]
                     | select(.value.result != "success" and .value.result != "skipped")
                     | "  \(.key): \(.value.result)"')"
          if [ -n "${bad}" ]; then
            echo "Not green:" >&2
            echo "${bad}" >&2
            exit 1
          fi
